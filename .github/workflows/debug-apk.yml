# Fork-only: builds an installable debug APK (applicationId suffix .test, installs beside the
# official app) for trying a branch on a phone. Download it from the run's Artifacts.
name: Debug APK

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build web bundle and sync
        working-directory: frontend
        run: |
          npm ci
          npm run build:mobile
      - name: Assemble debug APK
        working-directory: frontend/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: openGym-debug-${{ github.sha }}
          path: frontend/android/app/build/outputs/apk/debug/*.apk
