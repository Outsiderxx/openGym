# Fork-only: builds an APK for your own phone. With the ANDROID_KEYSTORE_B64 and
# ANDROID_KEYSTORE_PASSWORD secrets set, it is the release app ("openGym"), signed with that one
# fixed key so every later build installs over the last. Without them it falls back to the debug
# app ("openGym Test", installs beside the official one; a fresh key per run, so no in-place
# updates). Download it from the run's Artifacts, or, for builds of claude/apk-build, from the
# Release named after the app's versionName (v1.4.1-fork.1 …): the APK itself, no zip. A second
# build of the same version replaces that Release's APK rather than adding another Release.
name: Debug APK

on:
  push:
    branches: [develop, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write   # the Release below

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build web bundle and sync
        working-directory: frontend
        run: |
          npm ci
          npm run build:mobile
      - name: Assemble APK
        working-directory: frontend/android
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/out"
          if [ -n "$KS_B64" ]; then
            ./gradlew --no-daemon assembleRelease
            BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
            printf %s "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
            "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.jks" --ks-key-alias opengym \
              --ks-pass env:KS_PASS --key-pass env:KS_PASS \
              --out "$RUNNER_TEMP/out/openGym.apk" "$RUNNER_TEMP/aligned.apk"
            rm -f "$RUNNER_TEMP/ks.jks"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/out/openGym-test.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: openGym-${{ github.sha }}
          path: ${{ runner.temp }}/out/*.apk
      - name: Publish Release
        if: github.ref == 'refs/heads/claude/apk-build'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # a fork: never let gh pick the parent repo
        run: |
          set -eu
          VER="$(sed -n 's/^ *versionName "\(.*\)"/\1/p' frontend/android/app/build.gradle)"
          TAG="v$VER"
          SRC="$(ls "$RUNNER_TEMP"/out/*.apk | head -1)"
          case "$SRC" in *-test.apk) APK="openGym-test-$VER.apk" ;; *) APK="openGym-$VER.apk" ;; esac
          cp "$SRC" "$RUNNER_TEMP/$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/$APK" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/$APK" --target "$GITHUB_SHA" \
              --title "openGym $VER" --notes "Built from $GITHUB_SHA."
          fi
